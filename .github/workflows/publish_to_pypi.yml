name: Publish to PyPI

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version from setup.py
        id: get_version
        run: |
          version=$(sed -n "s/^[[:space:]]*version=['\"]\([^'\"]*\)['\"][[:space:]]*,/\1/p" setup.py)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Check if version exists on PyPI
        id: check_version
        run: |
          PACKAGE_NAME="dagsim"  
          VERSION="${{ steps.get_version.outputs.version }}"
          exists=$(curl -s https://pypi.org/pypi/$PACKAGE_NAME/json | jq -r ".releases | has(\"$VERSION\")")
          echo "exists=$exists" >> $GITHUB_OUTPUT

      - name: Fail if version exists
        if: ${{ steps.check_version.outputs.exists == 'true' }}
        run: |
          echo "Version ${{ steps.get_version.outputs.version }} already exists on PyPI. Please bump the version." >&2
          exit 1

      - name: Install build tool
        run: python -m pip install --upgrade build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
